_base_: ../_base_/default.yaml

model:
  backend: openai_chat
  optimizer_backend: openai_chat
  target_backend: openai_chat
  reasoning_effort: medium

train:
  train_size: 10
  batch_size: 4
  accumulation: 1
  num_epochs: 2
  seed: 42

gradient:
  minibatch_size: 2
  merge_batch_size: 2
  analyst_workers: 2

optimizer:
  learning_rate: 4

evaluation:
  sel_env_num: 0
  test_env_num: 0
  use_gate: true
  eval_test: true

env:
  name: image_role_skill
  skill_init: skillopt/envs/image_role_skill/skills/initial.md
  split_mode: split_dir
  split_dir: data/image_role_skill_split
  workers: 2
  limit: 0
  max_completion_tokens: 2048
  mock: false
  out_root: ../../labs/image_role_skill/outputs/run
